# 2026-11-02: every container's log is capped (2 files of 50 MB). Docker keeps logs forever by default: the furbo
# bridge's log had grown to 53 GB (Frigate 2 GB, app 1.9 GB) and, with an old recordings copy, filled the system disk.
x-logging: &keep-logs-small
  driver: json-file
  options:
    max-size: "50m"
    max-file: "2"

services:
  frigate:
    logging: *keep-logs-small
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    privileged: true
    shm_size: "512mb"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file: .env
  app:
    logging: *keep-logs-small
    container_name: vh-app
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frigate
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ha-auth.conf:/etc/nginx/ha-auth.conf:ro
      - ./furbo-auth.conf:/etc/nginx/furbo-auth.conf:ro
  caddy:
    logging: *keep-logs-small
    container_name: caddy
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-auth:/etc/caddy/auth:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    env_file: caddy.env
  # Short notification videos (mp4 or gif): waits until Frigate has saved the requested seconds, then passes the clip on
  clipwait:
    logging: *keep-logs-small
    container_name: clipwait
    image: python:3.12-alpine
    restart: unless-stopped
    depends_on:
      - frigate
    volumes:
      - ./repo/clipwait.py:/clipwait.py:ro
      - ./furbo-ctl:/ctl   # Settings button: which app gets the Upstairs & Bedroom Furbo (read by frigate-watchdog.py)
    command: ["sh", "-c", "apk add --no-cache ffmpeg >/dev/null 2>&1; exec python -u /clipwait.py"]
  # Furbo cameras (no local video of their own): the ha-furbo bridge holds the Furbo P2P session and serves
  # RTSP on 8564 for Frigate. Built on this machine from github.com/willbeeching/ha-furbo (furbo-bridge).
  # Settings and the Furbo login live in ./furbo-data/options.json on the mini PC only.
  furbo:
    logging: *keep-logs-small
    container_name: furbo
    build: https://github.com/willbeeching/ha-furbo.git#main:furbo-bridge
    image: furbo-bridge:local
    restart: unless-stopped   # 2026-10-08: also comes back by itself after the mini PC loses power (on-failure did not)
    network_mode: host
    volumes:
      - ./furbo-data:/data
      - ./repo/furbo-go2rtc.yaml:/app/go2rtc.yaml:ro
  # Xiaomi cameras (Mi Home): go2rtc's xiaomi source needs the host network (its P2P replies don't come back through
  # Docker's bridge). Serves RTSP on 8574 for Frigate. Secrets from .env (XIAOMI_TOKEN, FRIGATE_CAM_PW).
  xiaomi:
    logging: *keep-logs-small
    container_name: xiaomi
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./repo/xiaomi-go2rtc.yaml:/config/go2rtc.yaml:ro
