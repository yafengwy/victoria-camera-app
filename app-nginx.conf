map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
  }
  # Camera Mode in Home Assistant: only these two requests are passed on. The key is in ha-auth.conf on the
  # mini PC only (one line: proxy_set_header Authorization "Bearer <token>";), never in this repo.
  # Home Assistant refuses requests that look like they came through a proxy it does not know, so the
  # browser's forwarding headers, cookies and origin are not passed on.
  location = /ha/mode {
    proxy_pass http://192.168.1.252:8123/api/states/input_select.camera_mode;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/set {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.252:8123/api/services/input_select/select_option;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/snooze {
    proxy_pass http://192.168.1.252:8123/api/states/input_text.camera_snooze;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Today's Waiting (input_text.camera_waiting); it is set through /ha/snoozeset (input_text.set_value)
  location = /ha/waiting {
    proxy_pass http://192.168.1.252:8123/api/states/input_text.camera_waiting;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/snoozeset {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.252:8123/api/services/input_text/set_value;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Frigate API (snapshots, alerts, recordings)
  # Downloads with the date and time burned in (made by the clip service next to Frigate; long clips take a while)
  location /stamp/ {
    proxy_pass http://clipwait:8000;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
  location /api/ {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  # Live video (go2rtc over WebSocket), recording playback, alert thumbnails, motion events (/ws)
  location ~ ^/(live|vod|clips|exports|ws) {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
