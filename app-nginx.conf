map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
# Home controls on the camera pages (Home tab). Each action is a fixed Home Assistant call: the request body is set
# here, so the app can only do exactly these things (no other device can be reached through this).
map $uri $ha_dev_svc {
  default                         "";
  /ha/dev/do/cr_light_on          /api/services/light/turn_on;
  /ha/dev/do/cr_light_off         /api/services/light/turn_off;
  /ha/dev/do/cr_curtain_6         /api/services/cover/set_cover_position;
  /ha/dev/do/cr_curtain_40        /api/services/cover/set_cover_position;
  /ha/dev/do/cr_curtain_75        /api/services/cover/set_cover_position;
  /ha/dev/do/g_lock               /api/services/lock/lock;
  /ha/dev/do/g_unlock             /api/services/lock/unlock;
  /ha/dev/do/g_light_on           /api/services/light/turn_on;
  /ha/dev/do/g_light_off          /api/services/light/turn_off;
  /ha/dev/do/g_gatelight_on       /api/services/light/turn_on;
  /ha/dev/do/g_gatelight_off      /api/services/light/turn_off;
  /ha/dev/do/g_gate_open          /api/services/cover/set_cover_position;
  /ha/dev/do/g_gate_close         /api/services/cover/close_cover;
  /ha/dev/do/fd_lock              /api/services/lock/lock;
  /ha/dev/do/fd_unlock            /api/services/lock/unlock;
  /ha/dev/do/fd_light_on          /api/services/light/turn_on;
  /ha/dev/do/fd_light_off         /api/services/light/turn_off;
  /ha/dev/do/fy_light_on          /api/services/light/turn_on;
  /ha/dev/do/fy_light_off         /api/services/light/turn_off;
  /ha/dev/do/by_light_on          /api/services/light/turn_on;
  /ha/dev/do/by_light_off         /api/services/light/turn_off;
  /ha/dev/do/hue_wall_on          /api/services/light/turn_on;
  /ha/dev/do/hue_wall_off         /api/services/light/turn_off;
  /ha/dev/do/ly_light_on          /api/services/light/turn_on;
  /ha/dev/do/ly_light_off         /api/services/light/turn_off;
  /ha/dev/do/hue_relax            /api/services/scene/turn_on;
  /ha/dev/do/hue_tropical         /api/services/scene/turn_on;
  /ha/dev/do/hue_arctic           /api/services/scene/turn_on;
}
map $uri $ha_dev_body {
  default                         "";
  /ha/dev/do/cr_light_on          '{"entity_id":"light.california_room_light"}';
  /ha/dev/do/cr_light_off         '{"entity_id":"light.california_room_light"}';
  /ha/dev/do/cr_curtain_6         '{"entity_id":"cover.california_curtain_r","position":6}';
  /ha/dev/do/cr_curtain_40        '{"entity_id":"cover.california_curtain_r","position":40}';
  /ha/dev/do/cr_curtain_75        '{"entity_id":"cover.california_curtain_r","position":75}';
  /ha/dev/do/g_lock               '{"entity_id":"lock.garage_door_lock"}';
  /ha/dev/do/g_unlock             '{"entity_id":"lock.garage_door_lock"}';
  /ha/dev/do/g_light_on           '{"entity_id":"light.garage_light"}';
  /ha/dev/do/g_light_off          '{"entity_id":"light.garage_light"}';
  /ha/dev/do/g_gatelight_on       '{"entity_id":"light.garage_gate_light"}';
  /ha/dev/do/g_gatelight_off      '{"entity_id":"light.garage_gate_light"}';
  /ha/dev/do/g_gate_open          '{"entity_id":"cover.garage_gate","position":80}';
  /ha/dev/do/g_gate_close         '{"entity_id":"cover.garage_gate"}';
  /ha/dev/do/fd_lock              '{"entity_id":"lock.front_door_deadbolt"}';
  /ha/dev/do/fd_unlock            '{"entity_id":"lock.front_door_deadbolt"}';
  /ha/dev/do/fd_light_on          '{"entity_id":"light.front_door_light"}';
  /ha/dev/do/fd_light_off         '{"entity_id":"light.front_door_light"}';
  /ha/dev/do/fy_light_on          '{"entity_id":"light.front_yard_light"}';
  /ha/dev/do/fy_light_off         '{"entity_id":"light.front_yard_light"}';
  /ha/dev/do/by_light_on          '{"entity_id":"light.back_yard_light"}';
  /ha/dev/do/by_light_off         '{"entity_id":"light.back_yard_light"}';
  /ha/dev/do/hue_wall_on          '{"entity_id":"light.philips_hue_outdoor_wall"}';
  /ha/dev/do/hue_wall_off         '{"entity_id":"light.philips_hue_outdoor_wall"}';
  /ha/dev/do/ly_light_on          '{"entity_id":"light.left_yard_light"}';
  /ha/dev/do/ly_light_off         '{"entity_id":"light.left_yard_light"}';
  /ha/dev/do/hue_relax            '{"entity_id":"scene.philips_hue_outdoor_wall_relax"}';
  /ha/dev/do/hue_tropical         '{"entity_id":"scene.philips_hue_outdoor_wall_tropical_twilight"}';
  /ha/dev/do/hue_arctic           '{"entity_id":"scene.philips_hue_outdoor_wall_arctic_aurora"}';
}
server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
  }
  # Camera Mode in Home Assistant: only these two requests are passed on. The key is in ha-auth.conf on the
  # mini PC only (one line: proxy_set_header Authorization "Bearer <token>";), never in this repo.
  # Home Assistant refuses requests that look like they came through a proxy it does not know, so the
  # browser's forwarding headers, cookies and origin are not passed on.
  location = /ha/mode {
    proxy_pass http://192.168.1.252:8123/api/states/input_select.camera_mode;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/set {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.252:8123/api/services/input_select/select_option;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/snooze {
    proxy_pass http://192.168.1.252:8123/api/states/input_text.camera_snooze;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Today's Waiting (input_text.camera_waiting); it is set through /ha/snoozeset (input_text.set_value)
  location = /ha/waiting {
    proxy_pass http://192.168.1.252:8123/api/states/input_text.camera_waiting;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/snoozeset {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.252:8123/api/services/input_text/set_value;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Home tab: the state of the listed lights / curtains (read only)
  location ~ ^/ha/dev/st/(light\.california_room_light|cover\.california_curtain_r|lock\.garage_door_lock|light\.garage_light|light\.garage_gate_light|cover\.garage_gate|lock\.front_door_deadbolt|light\.front_door_light|light\.front_yard_light|light\.back_yard_light|light\.philips_hue_outdoor_wall|light\.left_yard_light|scene\.philips_hue_outdoor_wall_relax|scene\.philips_hue_outdoor_wall_tropical_twilight|scene\.philips_hue_outdoor_wall_arctic_aurora)$ {
    proxy_pass http://192.168.1.252:8123/api/states/$1;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Home tab: brightness of the Outdoor Wall Hue light, 1-100 only (the number is the only thing the app chooses)
  location ~ ^/ha/dev/bri/hue_wall/(100|[1-9][0-9]?)$ {
    limit_except POST { deny all; }
    set $hue_pct $1;
    set $hue_svc /api/services/light/turn_on;
    proxy_pass http://192.168.1.252:8123$hue_svc;
    proxy_method POST;
    proxy_set_body '{"entity_id":"light.philips_hue_outdoor_wall","brightness_pct":$hue_pct}';
    proxy_set_header Content-Type "application/json";
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Home tab: the fixed actions above (POST only; anything not in the list is refused)
  location ~ ^/ha/dev/do/[a-z0-9_]+$ {
    limit_except POST { deny all; }
    if ($ha_dev_svc = "") { return 404; }
    proxy_pass http://192.168.1.252:8123$ha_dev_svc;
    proxy_method POST;
    proxy_set_body $ha_dev_body;
    proxy_set_header Content-Type "application/json";
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Frigate API (snapshots, alerts, recordings)
  # Downloads with the date and time burned in (made by the clip service next to Frigate; long clips take a while)
  location /stamp/ {
    proxy_pass http://clipwait:8000;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
  location /api/ {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  # Live video (go2rtc over WebSocket), recording playback, alert thumbnails, motion events (/ws)
  location ~ ^/(live|vod|clips|exports|ws) {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
