map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
  }
  # Camera Mode in Home Assistant: only these two requests are passed on. The key is in ha-auth.conf on the
  # mini PC only (one line: proxy_set_header Authorization "Bearer <token>";), never in this repo.
  # Home Assistant refuses requests that look like they came through a proxy it does not know, so the
  # browser's forwarding headers, cookies and origin are not passed on.
  location = /ha/mode {
    proxy_pass http://192.168.1.252:8123/api/states/input_select.camera_mode;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  location = /ha/set {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.252:8123/api/services/input_select/select_option;
    include /etc/nginx/ha-auth.conf;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Via "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
  }
  # Furbo turn left/right: only the pan command, passed to the Furbo bridge with its key (furbo-auth.conf on the mini PC)
  location ~ "^/furbo/([A-Z0-9]{12})/pan$" {
    limit_except POST { deny all; }
    proxy_pass http://192.168.1.77:8791/api/cameras/$1/pan;
    include /etc/nginx/furbo-auth.conf;
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
  }
  # Frigate API (snapshots, alerts, recordings)
  location /api/ {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  # Live video (go2rtc over WebSocket), recording playback, alert thumbnails, motion events (/ws)
  location ~ ^/(live|vod|clips|ws) {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
