server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
  }
  location /api/ {
    proxy_pass http://frigate:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
