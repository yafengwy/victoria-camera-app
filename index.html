<meta charset="utf-8">
<title>Victoria's Home</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-title" content="Victoria's Home">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first camera app. Grouped camera cards, an expandable playback panel, an events page and a dark focus view. */
:root{
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg:#E7F6EE; --card:#FFFFFF; --head:#C4E7D5; --head-fg:#1F5C47; --strong:#45C58B; --strong-fg:#0B3323;
  --icon:#2C6E57; --chip:#DCF4E8; --text:#1C2B25; --sub:#4F6B60; --track:#E3F1EA; --line:#DCE6E0;
  --seg:#6F92F2; --seg-dim:#B9C9F7; --ev:#86E0B8; --ev-fg:#0F3B2A; --tag-bg:#FFFFFF; --tag-fg:#9A3A07;
  --dark-bg:#0F1113; --dark-card:#1A1D20; --dark-line:#262A2E; --dark-fg:#EEF1F3; --dark-sub:#9AA3AB; --dark-accent:#7CC4FF;
  color-scheme: light;
}
:root[data-app-theme="blue"]{
  --bg:#F1F3F9; --head:#DDE3F4; --head-fg:#26325C; --strong:#4A63B8; --strong-fg:#FFFFFF; --icon:#3A4A80; --chip:#E6EBF8;
  --text:#1B1F2B; --sub:#525A70; --track:#E9ECF5; --line:#DFE3EE; --seg:#E08A3C; --seg-dim:#F0C79F; --ev:#C9D4F2; --ev-fg:#1E2A55;
}
:root[data-dark]{
  --bg:#121514; --card:#1B201E; --head:#21402F; --head-fg:#A6E8C6; --strong:#3FBF86; --strong-fg:#06281A; --icon:#8FD8B3;
  --chip:#1F2C26; --text:#E6ECE9; --sub:#9AA8A1; --track:#26302B; --line:#2C3531; --seg:#7FA0FF; --seg-dim:#3E4E7A;
  --ev:#24473A; --ev-fg:#C9F2DD; --tag-bg:#F2F4F3; --tag-fg:#9A3A07; color-scheme:dark;
}
:root[data-dark][data-app-theme="blue"]{
  --bg:#121418; --card:#1A1D24; --head:#25304D; --head-fg:#BBC8F7; --strong:#6E86E0; --strong-fg:#0C1430; --icon:#A9B8F0;
  --chip:#20263A; --text:#E6E9F0; --sub:#9AA2B4; --track:#262B38; --line:#2C3140; --seg:#F0A060; --seg-dim:#6A4E36; --ev:#283458; --ev-fg:#D3DCFA;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent,var(--strong));outline-offset:2px}
svg{display:block;flex-shrink:0}
img{max-width:100%}
img.rf{opacity:0}
.ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--icon)}
.ic:active{background:var(--chip)}
.app{min-height:100%;display:flex;flex-direction:column}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-left:6px;font-size:18px;font-weight:800;color:var(--head-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topicons{display:flex;align-items:center;gap:2px;flex-shrink:0}
.main{flex:1;width:100%;max-width:1500px;margin:0 auto;padding:10px 10px 40px;display:flex;flex-direction:column;gap:12px}

/* Groups and cards */
.group{background:var(--card);border-radius:18px;padding:6px 10px 10px}
.ghead{display:flex;align-items:center;height:52px;gap:2px}
.gname{flex:1;font-size:17px;font-weight:800;color:var(--head-fg);display:flex;align-items:center;gap:8px;padding-left:6px}
.gcount{font-size:12px;font-weight:700;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
.cam{border-radius:14px;overflow:hidden;background:var(--head);display:flex;flex-direction:column;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .15s}
.cam.on{outline-color:var(--accent,var(--strong))}
.chead{height:44px;display:flex;align-items:center;padding:0 2px 0 12px;color:var(--head-fg)}
.cname{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;height:44px}
.cam .ic{color:var(--head-fg);width:38px;height:40px}
.frame{position:relative;aspect-ratio:16/9;background:#1E2226;overflow:hidden;touch-action:manipulation}
/* upright cameras (e.g. a doorbell): same height as the others, narrower, centred */
.cam.tall .frame{aspect-ratio:var(--ar);width:calc(100% * 9 / 16 * var(--ar));margin-inline:auto}
/* upright camera sharing a row: widths follow the picture shapes, so both are the same height */
.pairrow{grid-column:1/-1;display:flex;gap:inherit;min-width:0}
.pairrow > .cam{flex:var(--fr) 1 0;width:0;min-width:0}
.pairrow > .cam .frame{aspect-ratio:16/9}
.pairrow > .cam.tall .frame{aspect-ratio:var(--ar);width:100%;margin:0}
/* Doorbell 30% bigger than an even split: its width W·0.975/2.528, the camera beside it fills the rest at the same height */
.pairrow{container-type:inline-size}
.pairrow > .cam.tall{flex:0 0 calc((100cqw - 8px) * 0.975 / 2.528)}
.pairrow > .cam:not(.tall){flex:1 1 0}
/* wide screens: Front Door's very wide picture is cut to the card; keep more of its right side (0% left … 100% right) */
@media (min-width:560px){.cam.fdoor .frame{--px:.7}}
@media (max-width:559px){.cam.fdoor.slim .frame{--px:.6}}   /* phone, one per row */
/* the camera beside the Doorbell keeps the right edge of its picture (--fx: 100% = right edge, 50% = centre) */
.pairrow > .cam:not(.tall) .frame{--px:.8}
.pairrow > .cam:not(.tall) .frame{aspect-ratio:auto;height:calc((100cqw - 8px) * 1.3 / 2.528)}
/* 3 or more per row: two rows tall, picture fills the card */
.grid .cam.span2{grid-row:span 2;align-self:stretch;min-height:0}
.cam.span2 .frame img,.cam.span2 .frame .lvh,.cam.span2 .frame .lvc,.cam.span2 .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid:has(.span2){container-type:inline-size}
.fblock{grid-column:1/-1;display:flex;gap:8px;align-items:stretch;min-width:0}
.fblock > .cam{flex:0 0 56%;min-width:0}
.fblock > .cam .frame{aspect-ratio:var(--ar);width:100%;margin:0}
.fbside{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.fbside > .cam{flex:1 1 0;min-height:0}
.fbside > .cam .frame{flex:1 1 0;height:0;aspect-ratio:auto}
.fblock .frame img,.fblock .frame .lvh,.fblock .frame .lvc,.fblock .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fbside .frame{--bt:5px;--bh:22px}
/* an opened camera beside the Doorbell: its control row at half size so all buttons fit */
.fbside .chead{height:26px;padding:0 4px 0 8px;gap:0}
.fbside .chead .cname{font-size:11px;height:26px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbside .chead .chctl{gap:0;flex-shrink:0}
.fbside .chead .ic{width:22px;min-width:22px;height:22px;padding:0}
.fbside .chead .ic svg{width:14px;height:14px}
.fbside .chead .chlive{height:20px;padding:0 7px;font-size:10px;border-radius:10px}
.cam.door .frame img,.cam.door .frame video,.fvid.door img,.fvid.door video{object-fit:fill!important}
.wt.door img,.wt.door video{object-fit:fill!important}
/* every picture and video drawn at the camera's real shape (--R), cut to its box (cover) or fitted inside (vcon) */
.vfit{container-type:size!important}
.vfit > img,.vfit video{position:absolute!important;inset:auto!important;max-width:none!important;max-height:none!important;object-fit:fill!important;
  width:max(100cqw, 100cqh * var(--R,1.7778))!important;height:max(100cqh, 100cqw / var(--R,1.7778))!important;
  left:calc((100cqw - max(100cqw, 100cqh * var(--R,1.7778))) * var(--px,.5))!important;top:calc((100cqh - max(100cqh, 100cqw / var(--R,1.7778))) * var(--py,.5))!important}
.vfit.vcon > img,.vfit.vcon video{width:min(100cqw, 100cqh * var(--R,1.7778))!important;height:min(100cqh, 100cqw / var(--R,1.7778))!important;
  left:calc((100cqw - min(100cqw, 100cqh * var(--R,1.7778))) / 2)!important;top:calc((100cqh - min(100cqh, 100cqw / var(--R,1.7778))) / 2)!important}
@media (orientation:landscape){.full:not(.ui) .fvw.vfit > img,.full:not(.ui) .fvw.vfit video{width:max(100cqw, 100cqh * var(--R,1.7778))!important;height:max(100cqh, 100cqw / var(--R,1.7778))!important;
  left:calc((100cqw - max(100cqw, 100cqh * var(--R,1.7778))) / 2)!important;top:calc((100cqh - max(100cqh, 100cqw / var(--R,1.7778))) / 2)!important}}
.full.door .fvw img,.full.door .fvw video{position:absolute;inset:0;margin:auto;width:auto!important;height:100%!important;max-width:100%;aspect-ratio:3/4;object-fit:fill!important}
/* the two beside the Doorbell keep the right edge of their picture */
.fbside .frame{--px:1}
/* the Doorbell always shows its whole picture: Nest sometimes sends a slightly different shape, which used to crop
   the sides now and then */

.fbside .badge{font-size:10px;padding:0 7px}
.fbside .ctm{display:none}
.fbside .cnm{max-width:94%;font-size:11px}
.fbside .fsnd svg{width:13px;height:13px}
.tallblock{grid-column:1/-1;display:flex;gap:inherit;align-items:stretch;min-width:0}
.tallblock > .cam{flex:0 0 var(--dw,25%);min-width:0}
.tallblock > .cam .frame{flex:1 1 0;height:0;aspect-ratio:auto;width:100%;margin:0}
.tallblock > .cam .frame img,.tallblock > .cam .frame .lvh,.tallblock > .cam .frame .lvc,.tallblock > .cam .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tallblock > .tbgrid{flex:1 1 0;min-width:0}
.tallblock.haspanel > .cam{align-self:flex-start;height:var(--th)}
.cam.span2 .frame{flex:1 1 0;height:0;overflow:hidden;aspect-ratio:auto;width:100%;margin:0;min-height:calc((100cqw - (var(--cols) - 1) * 10px) / var(--cols) * 1.125 + 10px)}
.grid:not(.compact) .cam.span2 .frame{min-height:calc((100cqw - (var(--cols) - 1) * 10px) / var(--cols) * 1.125 + 54px)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.frame .hit{position:absolute;inset:0;width:100%;height:100%}
.brc{display:flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;margin:0 .15em 0 -.35em;border-right:1px solid rgba(255,255,255,.3);padding-right:.35em;box-sizing:content-box}
.brc svg{width:1.1em;height:1.1em}
.cnm.rcn,.fnmbr.rcn{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cnm.rcn.rcnow,.fnmbr.rcn.rcnow{animation:rcnflash .9s ease}
@keyframes rcnflash{0%,100%{opacity:1}35%{opacity:.35}}
.badge{position:absolute;top:8px;right:8px;height:30px;padding:0 11px;border-radius:15px;background:rgba(18,22,24,.72);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;z-index:2}
.badge.past{background:rgba(255,255,255,.94);color:#16191B}
.dot{width:7px;height:7px;border-radius:50%;background:#3DDC84}
.dot.busy{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.tag{position:absolute;left:8px;bottom:8px;padding:4px 9px;border-radius:6px;background:var(--tag-bg);color:var(--tag-fg);font-size:12px;font-weight:800;z-index:2}
.grid.compact .chead{height:38px;padding-left:10px}
.grid.compact .cname{font-size:13px}
.grid.compact .badge{height:26px;font-size:11px;padding:0 8px;top:6px;right:6px}

/* Playback panel */
.grid.dense{grid-auto-flow:row dense}
.panel{grid-column:1/-1;border-radius:14px;overflow:hidden;background:var(--chip)}
.pctl{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.round{width:50px;height:50px;border-radius:25px;background:var(--strong);color:var(--strong-fg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.round.ghost{background:var(--card);color:var(--head-fg)}
.trio{display:flex;gap:6px;padding:5px;border-radius:30px;background:var(--strong)}
.trio button{width:42px;height:42px;border-radius:21px;background:rgba(255,255,255,.24);color:var(--strong-fg);display:flex;align-items:center;justify-content:center}
.tl{background:var(--card);padding:10px 14px 18px;display:flex;flex-direction:column;gap:8px}
.tlrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.pill{padding:4px 14px;border-radius:999px;background:var(--chip);color:var(--head-fg)}
.tl{touch-action:none}
.track{position:relative;height:48px;border-radius:24px;background:var(--track);touch-action:none;cursor:ew-resize;user-select:none}
.seg{position:absolute;top:9px;bottom:9px;width:8px;margin-left:-4px;border-radius:4px;pointer-events:none}
.head-mk{position:absolute;top:-6px;bottom:-6px;width:14px;margin-left:-7px;border-radius:7px;background:#fff;border:2px solid var(--head-fg);pointer-events:none}
.readout{text-align:center;font-size:12px;font-weight:600;color:var(--sub)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--head)}
.tabs:has(> :nth-child(4)){grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--head-fg)}
.tabs button[aria-selected="true"]{background:var(--chip);font-weight:800}
.tabbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-x;padding:2px 0;scrollbar-width:none;flex-shrink:0}
.thumb{flex-shrink:0;width:136px;height:78px;position:relative;border-radius:8px;overflow:hidden;background:#1E2226}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;background:rgba(18,22,24,.72);color:#fff;font-size:11px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}
.thumb.cur{outline:3px solid var(--hot);outline-offset:-3px}   /* same orange as the alert icons on the timeline, every theme */
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--head);color:var(--head-fg);font-size:14px;font-weight:800;align-self:center}
.btn.solid{background:var(--strong);color:var(--strong-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;height:36px;padding:0 14px;border-radius:18px;background:var(--track);color:var(--sub);font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--chip);color:var(--head-fg);box-shadow:inset 0 0 0 1.5px var(--accent,var(--strong))}
.empty{font-size:13px;color:var(--sub);padding:6px 2px}

/* Bottom bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:220px;height:62px;border-radius:31px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);display:grid;grid-template-columns:1fr 1fr}
.bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--sub);border-radius:31px}
.bar button[aria-current="page"]{color:var(--head-fg);font-weight:800}

/* Overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,16,14,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;background:var(--chip);font-size:17px;font-weight:800;color:var(--head-fg)}
.dbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;font-weight:800;color:var(--sub)}
.check{display:flex;align-items:center;gap:12px;min-height:40px;font-size:15px;font-weight:600;text-align:left}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--accent,var(--strong));display:flex;align-items:center;justify-content:center;color:var(--strong-fg);flex-shrink:0}
.check[aria-checked="true"] .box{background:var(--strong)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--track)}
.seg2 button{height:42px;border-radius:9px;font-size:14px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:15px;color:var(--text);background:var(--card);width:100%}
.note{font-size:12px;color:var(--sub);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:#16191B;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;max-width:90vw}

/* Events page */
.evtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card)}
.evbar{height:60px;display:flex;align-items:center;padding:0 6px 0 16px;background:var(--chip);font-size:20px;font-weight:800;color:var(--head-fg)}
.fbtn{width:100%;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;font-size:16px;font-weight:800;border-bottom:1px solid var(--line)}
.fpanel{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--card)}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--card)}
.day{flex-shrink:0;height:40px;padding:0 6px 0 14px;border-radius:20px;border:1.5px solid var(--line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;background:var(--card)}
.day[aria-pressed="true"]{background:var(--strong);border-color:var(--strong);color:var(--strong-fg)}
.day b{min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--chip);color:var(--head-fg);display:flex;align-items:center;justify-content:center;font-size:13px}
.day[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:var(--strong-fg)}
.evwrap{display:flex;max-width:900px;width:100%;margin:0 auto}
.evlist{flex:1;min-width:0;padding:12px 8px 120px 12px;display:flex;flex-direction:column;gap:12px}
.hourh{font-size:13px;font-weight:800;color:var(--sub);padding:4px 2px 0;scroll-margin-top:200px}
.evcard{border-radius:12px;overflow:hidden;background:var(--ev)}
.evcard.dim{background:var(--track)}
.evh{display:flex;align-items:center;padding:6px 2px 6px 12px;color:var(--ev-fg)}
.evh .ic{color:var(--ev-fg);width:42px;height:42px}
.evt{flex:1;min-width:0}
.evt div:first-child{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.evt div:last-child{font-size:12px;font-weight:600}
.evcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.hours{width:48px;flex-shrink:0;padding:12px 6px 120px 0;display:flex;flex-direction:column;gap:3px;position:sticky;top:220px;align-self:flex-start}
.hr{height:30px;border-radius:6px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.hr.has{background:var(--chip);color:var(--head-fg);font-weight:800}

/* Focus view (dark, Google Home style) */

/* ---- v30: list view uses the same slim section label; selected camera gets a soft ring, not a hard white border ---- */
.cam.on{outline:2px solid color-mix(in srgb,var(--strong) 45%,transparent);outline-offset:-2px}
.hr.fut{color:color-mix(in srgb,var(--sub) 45%,transparent)}
.hr.fut i{opacity:.3}
.hours{height:calc(100dvh - var(--evtop,124px) - env(safe-area-inset-bottom,0px))}

/* ---- v34: full screen = picture only; tap shows a narrow right column (vertical timeline or alert list), picture shrinks left ---- */
.full{flex-direction:row;align-items:stretch;justify-content:stretch}
.fvw{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#000}
.fvw img{width:100%;height:100%;object-fit:contain}
.fuitop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:10px;display:flex;align-items:center;gap:8px}
.fuitop .dk{background:rgba(0,0,0,.55);color:#fff}
.fside{flex:0 0 92px;display:flex;flex-direction:column;background:#101318;border-left:1px solid rgba(255,255,255,.08);padding:calc(8px + env(safe-area-inset-top,0px)) env(safe-area-inset-right,0px) calc(8px + env(safe-area-inset-bottom,0px)) 0;transition:flex-basis .2s}
.fside.wide{flex-basis:150px}
.fsh,.fsb{display:flex;justify-content:center;gap:6px;padding:0 6px}
.fsb{padding-top:8px}
.dk.sm{width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.1);color:#fff}
.dk.sm.on{background:#fff;color:#111}
.dk.sm.wide{width:auto;padding:0 10px;font-size:12px;font-weight:800}
.fts{position:relative;flex:1;min-height:0;margin-top:8px}
.ftsc{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;touch-action:pan-y;overscroll-behavior-y:contain}
.ftsc::-webkit-scrollbar{display:none}
.ftsc .sp{flex:0 0 50%}
.ftrack{flex:0 0 auto;position:relative;width:100%}
.ftk{position:absolute;left:0;height:1px;background:rgba(255,255,255,.4)}
.flb{position:absolute;left:13px;transform:translateY(-50%);font-size:10px;font-weight:700;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;white-space:nowrap}
.fseg{position:absolute;right:8px;width:12px;border-radius:3px;background:var(--hot);padding:0}
.fseg.un{background:#E8B54A}
.fline2{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#FF4D4F;pointer-events:none}
.fbub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:10px;background:#D9342B;color:#fff;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none}
.fpl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px 6px 4px}
.fpd{flex-shrink:0;font-size:10px;font-weight:800;color:rgba(255,255,255,.55);padding:6px 2px 0}
.fpe{font-size:11px;color:rgba(255,255,255,.55);padding:8px 2px}
.fpi{display:block;flex-shrink:0;width:100%;border-radius:8px;overflow:hidden;background:#1C2027;text-align:left;box-shadow:inset 3px 0 0 var(--hot)}
.fpi.un{box-shadow:inset 3px 0 0 #E8B54A}
.fpi.cur{outline:2px solid #fff;outline-offset:-2px}
.fpi img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.fpi span{display:block;padding:3px 6px 4px;font-size:10px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzoom{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.9);color:#111;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}
@media (pointer:fine){#rvsc,#ftsc,#fsc{cursor:grab;user-select:none}#rvsc.grabbing,#ftsc.grabbing,#fsc.grabbing{cursor:grabbing}}
.zdesk,.zdesk2{display:none!important}
@media (pointer:fine){.zdesk{display:flex!important;font-size:18px!important}.zdesk2{display:flex!important}}

.hovtip{position:fixed;z-index:60;transform:translateX(-50%);padding:3px 8px;border-radius:8px;background:rgba(18,22,24,.88);color:#fff;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
@media (pointer:fine){
  .thumbs{scrollbar-width:thin;scrollbar-color:var(--sub) transparent;padding-bottom:8px;cursor:grab}
  .thumbs::-webkit-scrollbar{display:block;height:5px}
  .thumbs::-webkit-scrollbar-thumb{background:var(--sub);border-radius:3px}
  .thumbs::-webkit-scrollbar-track{background:transparent}
}
.hovline{position:absolute;pointer-events:none;z-index:3;background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 7px)}
.hovline.h{top:20px;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,var(--text) 0 4px,transparent 4px 7px)}
.hovline.v{left:0;right:0;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--text) 0 4px,transparent 4px 7px)}
.fts .hovline.v{background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 7px)}

/* ---- v41: vertical timelines start at the top: playhead 24px from the top, older time below ---- */
/* (v72: the Review page's vertical timeline keeps its playhead in the middle again, so alerts above and below it can
   both be reached; only the camera full view keeps it near the top) */
.ftsc .sp:first-child{flex:0 0 24px}
.ftsc .sp:last-child{flex:0 0 100%}
.fline2{top:24px}
.fbub{top:24px}
.fzoom{top:46px}
/* ---- v43: wide screens use the same top icons as the phone; the side strip is only for the iPhone Duo cover screen ---- */
@media (min-width:1000px){
  :root:not([data-cover]) .rail{display:none}
  :root:not([data-cover]) .app{padding-left:0}
  .rvdock{left:0}
  .rvctl{left:50%}
  .rvdock.v .rvctl{right:calc(104px + (100vw - 104px) / 2)}
}
/* ---- v44: Duo cover screen: the top of the side strip belongs to the iPhone (camera, clock, Wi-Fi); all icons sit at the bottom ---- */
:root[data-cover] .rail{justify-content:flex-end;padding-top:0}
:root[data-cover] .rail > div[style="flex:1"]{display:none}
.pillk{color:#fff}
.hico{position:absolute;width:15px;height:15px;pointer-events:none;display:flex}
.hico svg{width:15px;height:15px}
.segi{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;display:flex;pointer-events:none;z-index:1}
.segi svg{width:16px;height:16px}
.fico{position:absolute;right:24px;width:15px;height:15px;display:flex;color:var(--hot);pointer-events:none}
.fico.un{color:#E8B54A}
.fico svg{width:15px;height:15px}
.lico,.fev i.lico{display:inline-flex;vertical-align:-2px;margin-right:4px;font-style:normal;width:auto;height:auto;background:none;border-radius:0}
.lico svg{width:1.05em;height:1.05em}
.modot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#F2C230;margin-right:6px;vertical-align:.05em;flex:none;font-style:normal}
.molo{padding:10px 14px;color:var(--sub);font-size:13px;font-weight:700}
.btn.momore{display:block;width:calc(100% - 16px);margin:6px 8px 14px}
.fpanel2 .frow .mrow.tight{width:auto;flex:0 1 auto;border-top:0;white-space:nowrap;gap:6px;font-size:15px}
.fpanel2 .frow:has(> .mrow.tight){flex-wrap:wrap;justify-content:space-between;row-gap:0}
.mrow .modot,.check .modot{margin-right:0}
.fmark.ico{left:54px;width:18px;height:18px;border-radius:9px;background:var(--dark-bg);color:#B9CCFF;display:flex;align-items:center;justify-content:center;box-shadow:none;border:0}
.fmark.ico.dim{color:#7C858E;background:var(--dark-bg)}
.fmark.ico svg{width:14px;height:14px}
:root[data-app-theme="blue"]:not([data-dark]){--segi:#B4561A;--segi-dim:#9A7350}
:root[data-app-theme="glass"]:not([data-dark]) .track{background:rgba(22,32,51,.09)}
:root[data-app-theme="glass"][data-dark] .track{background:rgba(255,255,255,.1)}
.segn{position:absolute;top:-7px;right:-10px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:currentColor;font:800 9px/13px var(--font);text-align:center}
.segn i{font-style:normal;color:var(--card)}
:root[data-app-theme="glass"]:not([data-dark]) .segn i{color:#fff}
:root[data-dark] .segn i{color:#0B0F15}

/* ---- v53: Interesting = icon in a solid orange circle, Uninteresting = plain grey outline icon (all timelines + picture tags) ---- */
:root{--hot:#D9541E;--cold:#66738A}
:root[data-dark]{--hot:#FF8A3D;--cold:#8FA0B8}
.segi{color:var(--cold)}
.segi.hot,.hico.hot,.fico:not(.un),.fmark.ico:not(.dim){width:22px;height:22px;border-radius:11px;background:var(--hot);color:#fff;align-items:center;justify-content:center}
.segi.hot{margin:-11px 0 0 -11px}
.segi.hot svg,.hico.hot svg,.fico:not(.un) svg,.fmark.ico:not(.dim) svg{width:13px;height:13px}
.hico{color:var(--cold)}
.fico.un{color:#8FA0B8}
.fico:not(.un){right:20px;margin-top:-3.5px;display:flex}
.fmark.ico:not(.dim){left:52px;width:22px;height:22px;margin-top:-2px}
:root[data-dark] .segi.hot,:root[data-dark] .hico.hot,:root[data-dark] .fico:not(.un),:root[data-dark] .fmark.ico:not(.dim){color:#1A0E05}
.segi.hot .segn{color:var(--hot)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--hot);color:#fff}
.tag svg{width:13px;height:13px;flex-shrink:0}
:root[data-dark] .tag:not(.un),:root[data-dark] .focus .tag:not(.un){background:var(--hot);color:#1A0E05}
.focus .tag:not(.un){background:var(--hot)}
.tag.un{background:rgba(18,22,24,.66);color:#E6ECF2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rvcam .tag svg{width:11px;height:11px}

/* ---- v54: playhead always above alert icons; option B = two rows (Interesting top, Uninteresting bottom) ---- */
.head-mk{z-index:5}
.track.lanes{height:40px;border-radius:12px}
.track.lanes::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:var(--sub);opacity:.3;pointer-events:none}
.segi.lane{width:15px;height:15px;margin:-7.5px 0 0 -7.5px}
.segi.lane svg{width:15px;height:15px}
.segi.lane.ltop{top:27%;color:var(--hot)}
.segi.lane.lbot{top:73%;color:var(--cold)}
.segi.lane .segn{top:-6px;right:-11px}
.segi.lane.ltop .segn{color:var(--hot)}
.segi.lane.lbot .segn{color:var(--cold)}
.segi.ring{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:11px;box-shadow:inset 0 0 0 2px var(--hot);color:var(--hot);align-items:center;justify-content:center;background:var(--card)}
.segi.ring svg{width:13px;height:13px}
.segi.ring .segn{color:var(--hot)}
:root{--hot-ink:#A93C0A}
:root[data-dark]{--hot-ink:#FF8A3D}
.segi.mdot,.segi.mdotu{margin-top:-11px}
.segi.mdot{color:var(--hot-ink)}
.segi.mdot::after{content:"";position:absolute;left:50%;top:100%;width:5px;height:5px;margin:2px 0 0 -2.5px;border-radius:3px;background:var(--hot)}
.segi.mdot .segn{color:var(--hot)}
.rvz{display:none}
@media (pointer:fine){
  .rvz{display:flex;align-items:center;justify-content:center;gap:2px;position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;padding:3px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .rvz button{width:26px;height:26px;border-radius:13px;font-size:16px;font-weight:800;color:var(--head-fg);display:flex;align-items:center;justify-content:center}
  .rvz button:hover{background:var(--chip)}
  .rvz span{min-width:54px;text-align:center;font-size:11px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
  .rvdock.v .rvz{left:6px;right:6px;bottom:10px;padding:2px}
  .rvdock.v .rvz span{min-width:0;flex:1;font-size:12px}
  .rvdock:not(.v) .rvz{top:-38px;bottom:auto}
}
.rvcam{cursor:pointer}
/* Alert Icons style (Settings) also drives the focus, full-screen and Review rails */
:root[data-mark="e"] .hico.hot,:root[data-mark="e"] .fico:not(.un),:root[data-mark="e"] .fmark.ico:not(.dim){background:transparent;box-shadow:inset 0 0 0 2px var(--hot);color:var(--hot)}
:root[data-mark="e"] .fmark.ico:not(.dim){background:var(--dark-bg)}
:root[data-mark="d"] .hico.hot,:root[data-mark="d"] .fico:not(.un),:root[data-mark="d"] .fmark.ico:not(.dim),
:root[data-mark="b"] .hico.hot,:root[data-mark="b"] .fico:not(.un),:root[data-mark="b"] .fmark.ico:not(.dim){background:transparent;color:var(--hot)}
:root[data-mark="d"] .fmark.ico:not(.dim),:root[data-mark="b"] .fmark.ico:not(.dim){background:var(--dark-bg)}
:root[data-mark="d"]:not([data-dark]) .hico.hot,:root[data-mark="b"]:not([data-dark]) .hico.hot{color:var(--hot-ink)}
:root[data-mark="d"] .hico.hot svg,:root[data-mark="d"] .fico:not(.un) svg,:root[data-mark="d"] .fmark.ico:not(.dim) svg,
:root[data-mark="b"] .hico.hot svg,:root[data-mark="b"] .fico:not(.un) svg,:root[data-mark="b"] .fmark.ico:not(.dim) svg{width:16px;height:16px}
:root[data-mark="d"] .hico.hot::after,:root[data-mark="d"] .fico:not(.un)::after,:root[data-mark="d"] .fmark.ico:not(.dim)::after{content:"";position:absolute;left:50%;bottom:-3px;width:5px;height:5px;margin-left:-2.5px;border-radius:3px;background:var(--hot)}
:root[data-mark="d"] .hico.hot,:root[data-mark="d"] .fico:not(.un),:root[data-mark="d"] .fmark.ico:not(.dim){position:absolute}
.fmark.ico{cursor:pointer;z-index:1}

/* ---- Editorial styles: Noir (black & white); serif titles, same rounded wrapped cards as the other styles ---- */
:root[data-app-theme="noir"]{--font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--serif:'Cormorant Garamond','Playfair Display',Georgia,serif}
:root[data-app-theme="noir"]{--bg:#FFFFFF;--card:#FFFFFF;--head:#F2F2F0;--head-fg:#0A0A0A;--strong:#0A0A0A;--strong-fg:#FFFFFF;--icon:#0A0A0A;--chip:#F2F2F0;--text:#0A0A0A;--sub:#5A5A5A;--track:#F0F0EE;--line:rgba(0,0,0,.09);--seg:#0A0A0A;--seg-dim:#C8C8C6;--ev:#F2F2F0;--ev-fg:#0A0A0A;--tag-bg:#FFFFFF;--tag-fg:#0A0A0A;--rvgrey:#CFCFCC;--hot:#C8361E;--hot-ink:#A92A15;--cold:#6B6B6B;--segi:#0A0A0A;--segi-dim:#7A7A7A}

:is([data-app-theme="noir"]) :is(.brand,.rvtitle){font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.01em}
:is([data-app-theme="noir"]) .gname{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em}

:is([data-app-theme="noir"]) .cam .cname{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.005em}

.sseg.wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}

[data-app-theme="green"]{--font:'Roboto',system-ui,-apple-system,sans-serif}

/* Google light: tonal buttons (light blue fill, dark blue icon); lines, outlines and the logo dot use a visible mid blue */
:root[data-app-theme="google"]:not([data-dark]){--accent:#4F7FDB}
.lvh{position:absolute;inset:0;pointer-events:none}
.lvh[hidden]{display:none}
.dbgx summary{cursor:pointer;font-size:12px;color:var(--sub);padding:4px 0;list-style:none}
.dbgx summary::-webkit-details-marker{display:none}
.dbgx summary::after{content:' ▸'}
.dbgx[open] summary::after{content:' ▾'}
.fmark.ico .segn,.fico .segn{top:-6px;right:-9px;color:#FF8A3D;z-index:1;box-shadow:0 0 0 2px var(--dark-bg)}

const MIN = 60000, HOUR = 3600000, DAY = 86400000, WIN = 30 * MIN;
const store = {
  get(k, d) { try { const v = localStorage.getItem('homecams.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('homecams.' + k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const hms = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayLabel = t => dayStart(t) === dayStart(Date.now()) ? 'Today' : new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

   outdoor vehicles and things; indoor things; anything else A–Z */
const OBJ_SETS = [
  ['person', 'car', 'package'],
  ['amazon', 'fedex', 'ups', 'usps', 'dhl'],
  ['cat', 'dog', 'fox', 'raccoon', 'rabbit', 'squirrel', 'deer', 'bear', 'skunk', 'possum', 'rodent', 'horse', 'cow', 'goat', 'kangaroo'],
  ['garbage_truck', 'waste_bin', 'school_bus', 'bicycle', 'motorcycle', 'baby_stroller', 'bus', 'truck', 'boat', 'umbrella', 'bbq_grill', 'robot_lawnmower'],
  ['cell phone', 'cell_phone', 'laptop', 'remote', 'suitcase', 'backpack', 'handbag']
];
const ANIMALS = OBJ_SETS[2];
/* quick picks above the list: every animal, every delivery company */
const OBJ_GROUPS = [['animals', 'All Animals', o => ANIMALS.includes(String(o).toLowerCase())], ['carriers', 'All Carriers', o => isLogo(o)]];
function objSet(o) { const l = String(o).toLowerCase(); const k = OBJ_SETS.findIndex(st => st.includes(l)); return k < 0 ? OBJ_SETS.length : k; }
function objTier(o) { const l = String(o).toLowerCase(), k = objSet(o); return k * 100 + (k < OBJ_SETS.length ? OBJ_SETS[k].indexOf(l) : 0); }

function objGroup(f, key) {
  const g = OBJ_GROUPS.find(x => x[0] === key); if (!g) return;

  if (all) { f.objs = {}; list.forEach(o => { f.objs[o] = mine.includes(o); }); return; }
  const full = mine.every(o => objOn(f, o));
  list.forEach(o => { if (f.objs[o] === undefined) f.objs[o] = objOn(f, o); });

            this.video.disableRemotePlayback = true;
            this.video.srcObject = ms;
        } else {
            ms = new MediaSource();
            ms.addEventListener('sourceopen', () => {
                URL.revokeObjectURL(this.video.src);
                this.send({type: 'mse', value: this.codecs(MediaSource.isTypeSupported)});
            }, {once: true});

            this.video.src = URL.createObjectURL(ms);
            this.video.srcObject = null;
        }

        this.play();

        this.mseCodecs = '';

        this.onmessage['mse'] = msg => {
            if (msg.type !== 'mse') return;

            this.mseCodecs = msg.value;

            const sb = ms.addSourceBuffer(msg.value);
            sb.mode = 'segments'; // segments or sequence
            sb.addEventListener('updateend', () => {
                if (!sb.updating && bufLen > 0) {
                    try {
                        const data = buf.slice(0, bufLen);
                        sb.appendBuffer(data);
                        bufLen = 0;
                    } catch (e) {
                        // console.debug(e);
                    }
                }

                if (!sb.updating && sb.buffered && sb.buffered.length) {
                    const end = sb.buffered.end(sb.buffered.length - 1);
                    const start = end - 5;
                    const start0 = sb.buffered.start(0);
                    if (start > start0) {
                        sb.remove(start0, start);
                        ms.setLiveSeekableRange(start, end);
                    }
                    if (this.video.currentTime < start) {
                        this.video.currentTime = start;
                    }
                    const gap = end - this.video.currentTime;
                    this.video.playbackRate = gap > 0.1 ? gap : 0.1;
                    // console.debug('VideoRTC.buffered', gap, this.video.playbackRate, this.video.readyState);
                }
            });

            const buf = new Uint8Array(2 * 1024 * 1024);
            let bufLen = 0;

            this.ondata = data => {
                if (sb.updating || bufLen > 0) {
                    const b = new Uint8Array(data);
                    buf.set(b, bufLen);
                    bufLen += b.byteLength;
                    // console.debug('VideoRTC.buffer', b.byteLength, bufLen);
                } else {
                    try {
                        sb.appendBuffer(data);
                    } catch (e) {
                        // console.debug(e);
                    }
                }
            };
        };
    }

    onwebrtc() {
        const pc = new RTCPeerConnection(this.pcConfig);

        pc.addEventListener('icecandidate', ev => {
            if (ev.candidate && this.mode.includes('webrtc/tcp') && ev.candidate.protocol === 'udp') return;

            const candidate = ev.candidate ? ev.candidate.toJSON().candidate : '';
            this.send({type: 'webrtc/candidate', value: candidate});
        });

        pc.addEventListener('connectionstatechange', () => {
            if (pc.connectionState === 'connected') {
                const tracks = pc.getTransceivers()
                    .filter(tr => tr.currentDirection === 'recvonly') // skip inactive
                    .map(tr => tr.receiver.track);
                /** @type {HTMLVideoElement} */
                const video2 = document.createElement('video');
                video2.addEventListener('loadeddata', () => this.onpcvideo(video2), {once: true});
                video2.srcObject = new MediaStream(tracks);
            } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                pc.close(); // stop next events

                this.pcState = WebSocket.CLOSED;
                this.pc = null;

                this.onconnect();
            }
        });

        this.onmessage['webrtc'] = msg => {
            switch (msg.type) {
                case 'webrtc/candidate':
                    if (this.mode.includes('webrtc/tcp') && msg.value.includes(' udp ')) return;

                    pc.addIceCandidate({candidate: msg.value, sdpMid: '0'}).catch(er => {
                        console.warn(er);
                    });
                    break;
                case 'webrtc/answer':
                    pc.setRemoteDescription({type: 'answer', sdp: msg.value}).catch(er => {
                        console.warn(er);
                    });
                    break;
                case 'error':
                    if (!msg.value.includes('webrtc/offer')) return;
                    pc.close();
            }
        };

        this.createOffer(pc).then(offer => {
            this.send({type: 'webrtc/offer', value: offer.sdp});
        });

        this.pcState = WebSocket.CONNECTING;
        this.pc = pc;
    }

    /**
     * @param pc {RTCPeerConnection}
     * @return {Promise<RTCSessionDescriptionInit>}
     */
    async createOffer(pc) {
        try {
            if (this.media.includes('microphone')) {
                const media = await navigator.mediaDevices.getUserMedia({audio: true});
                media.getTracks().forEach(track => {
                    pc.addTransceiver(track, {direction: 'sendonly'});
                });
            }
        } catch (e) {
            console.warn(e);
        }

        for (const kind of ['video', 'audio']) {
            if (this.media.includes(kind)) {
                pc.addTransceiver(kind, {direction: 'recvonly'});
            }
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        return offer;
    }

    /**
     * @param video2 {HTMLVideoElement}
     */
    onpcvideo(video2) {
        if (this.pc) {
            // Video+Audio > Video, H265 > H264, Video > Audio, WebRTC > MSE
            let rtcPriority = 0, msePriority = 0;

            /** @type {MediaStream} */
            const stream = video2.srcObject;
            if (stream.getVideoTracks().length > 0) {
                // not the best, but a pretty simple way to check a codec
                const isH265Supported =  this.pc.remoteDescription.sdp.includes('H265/90000');
                rtcPriority += isH265Supported ? 0x240 : 0x220;
            }
            if (stream.getAudioTracks().length > 0) rtcPriority += 0x102;

            if (this.mseCodecs.includes('hvc1.')) msePriority += 0x230;
            if (this.mseCodecs.includes('avc1.')) msePriority += 0x210;
            if (this.mseCodecs.includes('mp4a.')) msePriority += 0x101;

            if (rtcPriority >= msePriority) {
                this.video.srcObject = stream;
                this.play();

                this.pcState = WebSocket.OPEN;

                this.wsState = WebSocket.CLOSED;
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            } else {
                this.pcState = WebSocket.CLOSED;
                if (this.pc) {
                    this.pc.close();
                    this.pc = null;
                }
            }
        }

        video2.srcObject = null;
    }

    onmjpeg() {
        this.ondata = data => {
            this.video.controls = false;
            this.video.poster = 'data:image/jpeg;base64,' + VideoRTC.btoa(data);
        };

        this.send({type: 'mjpeg'});
    }

    onhls() {
        this.onmessage['hls'] = msg => {
            if (msg.type !== 'hls') return;

            const url = 'http' + this.wsURL.substring(2, this.wsURL.indexOf('/ws')) + '/hls/';
            const playlist = msg.value.replace('hls/', url);
            this.video.src = 'data:application/vnd.apple.mpegurl;base64,' + btoa(playlist);
            this.play();
        };

        this.send({type: 'hls', value: this.codecs(type => this.video.canPlayType(type))});
    }

    onmp4() {
        /** @type {HTMLCanvasElement} **/
        const canvas = document.createElement('canvas');
        /** @type {CanvasRenderingContext2D} */
        let context;

        /** @type {HTMLVideoElement} */
        const video2 = document.createElement('video');
        video2.autoplay = true;
        video2.playsInline = true;
        video2.muted = true;

        video2.addEventListener('loadeddata', () => {
            if (!context) {
                canvas.width = video2.videoWidth;
                canvas.height = video2.videoHeight;
                context = canvas.getContext('2d');
            }

            context.drawImage(video2, 0, 0, canvas.width, canvas.height);

            this.video.controls = false;
            this.video.poster = canvas.toDataURL('image/jpeg');
        });

        this.ondata = data => {
            video2.src = 'data:video/mp4;base64,' + VideoRTC.btoa(data);
        };

        this.send({type: 'mp4', value: this.codecs(this.video.canPlayType)});
    }

    static btoa(buffer) {
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        let binary = '';
        for (let i = 0; i < len; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
    }
}

class LiveCam extends VideoRTC {
  onconnect() {
    if (this.suspended) return false;
    if (Live.scrolling && !this.ws && !this.pc) { this.want = true; return false; }
    /* a camera below or above the screen doesn't start its stream: every redraw of the home page used to start all 22
       at once (only ~5 are on screen), which froze the iPhone for seconds. It starts when it scrolls into view (the
       stream's own on-screen watcher calls this again then). */
    if (!this.ws && !this.pc) { const r = this.getBoundingClientRect(); if (!(r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight)) { this.want = true; return false; } }
    /* 2.10.8: new streams start one at a time, 0.3 s apart (12 on screen take ~3.5 s to all start). Starting 12 video
       decoders in the same moment froze the iPhone for 13.5 s right after opening (no slow redraw, nothing tapped);
       she prefers pictures coming a little later to any freeze. */
    if (!this.ws && !this.pc) {
      const now = Date.now(), wait = (Live.lastStart || 0) + 300 - now;
      if (wait > 0) { this.want = true; clearTimeout(Live.gTimer); Live.gTimer = setTimeout(() => Live.resume(), wait + 10); return false; }
      Live.lastStart = now;
    }
    this.want = false; return super.onconnect();
  }
  oninit() {
    super.oninit();
    this.video.controls = false; this.video.muted = true; this.video.autoplay = true; Snd.guard(this.video);
    this.video.addEventListener('playing', () => Snd.apply());
    this.video.setAttribute('playsinline', ''); this.video.disablePictureInPicture = true;
    /* the video stays invisible until it really plays, so the still picture underneath shows instead of the
       phone's big play button (Low Power Mode) or a crossed-out icon (camera not sending) */
    const v = this.video; v.style.opacity = '0';
    v.addEventListener('playing', () => { v.style.opacity = '1'; });
    ['pause', 'emptied', 'error', 'abort'].forEach(ev => v.addEventListener(ev, () => { v.style.opacity = '0'; }));
  }
}
